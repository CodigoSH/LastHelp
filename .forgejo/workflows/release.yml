# Builds, signs and publishes a release when a v* tag is pushed.
#
# Only tags. Nothing here runs on a branch, so a release is always something
# somebody chose to cut rather than something a merge caused.
#
# The build is scripts/build-artefacts.sh, not a copy of it. A workflow that
# rebuilt that by hand would be a second implementation of the release and the
# two would drift — and that script is also what an outsider runs to check that
# the published binaries match the published source.
#
# Signing is not optional. A release nobody can verify is worse than no release:
# it teaches people that the signature is decoration.
#
# The signing key lives in a repository secret, which is to say on a server, and
# that is a real trade made knowingly. The alternative is a human at a terminal
# for every release, and a release nobody can cut is a fix nobody receives.
# Losing the secret costs a release; losing the key costs every future update.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # See ci.yml: the label lands on a 2021 Debian image by default. Pinned so
    # what the release is built and published on is a decision in the diff.
    container: node:24-trixie
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The suite before anything is published. A tag can be deleted; a release
      # people have already downloaded cannot.
      #
      # `bun run build` comes before anything that compiles Go, and the order is
      # load-bearing. The binary embeds internal/web/dist, which is build output
      # and therefore not in the repository, so on a fresh checkout `go vet`
      # fails with "pattern all:dist: no matching files found" — a message about
      # embedding that reads like a broken build. Locally it never happens,
      # because the directory is left over from the last build.
      #
      # ci.yml learned this and was fixed; this file kept the old order and
      # nothing noticed, because nothing here runs until a tag is pushed. The
      # first release died on it twenty-three seconds in, with the tag already
      # public. The same list written twice is how one of them drifts.
      - name: preflight
        run: |
          bun install --frozen-lockfile
          test -z "$(gofmt -l ./cmd ./internal)"
          bun run build
          go vet ./...
          go test -count=1 ./internal/arch/
          go test -count=1 -race ./...
          bun run typecheck
          bun test
          bun run i18n:sync
          bun run i18n:scan

      - name: build
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/build-artefacts.sh

      # Built twice and compared, because "rebuild it and compare the hashes" is
      # written in SECURITY.md and a promise nobody executes is a promise that
      # quietly stops being true.
      - name: the build is reproducible
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          cp dist/SHA256SUMS /tmp/first.sums
          OUT=dist2 ./scripts/build-artefacts.sh >/dev/null
          if ! diff <(sed 's|dist2/||' dist2/SHA256SUMS) /tmp/first.sums; then
            echo "two builds of the same commit produced different bytes."
            echo "SECURITY.md tells people they can rebuild and compare; that has to be true."
            exit 1
          fi
          rm -rf dist2

      - name: sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          go run ./cmd/sign sign dist/SHA256SUMS
          test -s dist/SHA256SUMS.sig

      - name: publish
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Without this the first sign of a missing secret is a release that
          # never appears, diagnosed from a curl that said nothing.
          [ -n "$CI_TOKEN" ] || { echo "CI_TOKEN is not set" >&2; exit 1; }

          # The notes come from the file the release script committed at this
          # tag. They used to be cut out of CHANGELOG.md, which stopped working
          # the day betas left that file: every beta would have been published
          # with an empty body, and nothing would have said so.
          #
          # CHANGELOG.md stays as the fallback, because a stable does have a
          # section there. If neither has anything, this stops: an empty
          # release body is the silent failure, and the job can be re-run.
          notes_file="RELEASE_NOTES_${TAG}.md"
          if [ -f "$notes_file" ]; then
            body=$(cat "$notes_file")
          else
            body=$(awk "/^## \\[${TAG#v}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          fi
          [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ] || {
            echo "no notes for $TAG: neither $notes_file nor a CHANGELOG.md section" >&2
            exit 1
          }

          # A beta has to be published AS a beta. The forge decides what
          # /releases/latest answers from this flag, and that endpoint is the
          # one the stable channel asks — so a beta published without it is
          # offered to every installation that chose not to run betas, which is
          # the whole reason there are two channels.
          case "$TAG" in
            *-Beta.*|*-RC.*) pre=true ;;
            *)               pre=false ;;
          esac

          # python3, not jq: jq is in neither the bullseye nor the bookworm
          # image, and this step had never run — the first release would have
          # died on `jq: command not found` with the tag already pushed.
          payload=$(TAG="$TAG" BODY="$body" PRE="$pre" python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["TAG"], "name": os.environ["TAG"], "body": os.environ["BODY"], "draft": True, "prerelease": os.environ["PRE"] == "true"}))')

          api="${GITHUB_API_URL:-$FORGEJO_API}/repos/${GITHUB_REPOSITORY}"

          # A release for this tag may already exist — forcing a tag re-runs
          # this workflow, and POST /releases then answers with a conflict.
          # `curl -sf` turned that into exit 22 and a red job with nothing
          # wrong, so the tag is asked about first and an existing release is
          # updated in place.
          existing=$(curl -s -o /dev/null -w '%{http_code}' \
            "$api/releases/tags/${TAG}" \
            -H "Authorization: token ${CI_TOKEN}")

          if [ "$existing" = "200" ]; then
            echo "a release for ${TAG} exists; updating it"
            id=$(curl -sf "$api/releases/tags/${TAG}" \
              -H "Authorization: token ${CI_TOKEN}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            [ -n "$id" ] || { echo "the forge did not return a release id" >&2; exit 1; }

            # Back to draft while the assets are swapped, so nobody downloads a
            # release that is halfway through being rebuilt.
            curl -sf -X PATCH "$api/releases/${id}" \
              -H "Authorization: token ${CI_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$payload" > /dev/null

            # The old assets go first: uploading a file whose name is already
            # there is refused, and the release would keep the binaries of the
            # build this one is replacing.
            curl -sf "$api/releases/${id}/assets" \
              -H "Authorization: token ${CI_TOKEN}" \
              | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin)]' \
              | while read -r asset; do
                  curl -sf -X DELETE "$api/releases/${id}/assets/${asset}" \
                    -H "Authorization: token ${CI_TOKEN}" > /dev/null
                done
          else
            release=$(curl -sf -X POST "$api/releases" \
              -H "Authorization: token ${CI_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$payload")

            id=$(echo "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            [ -n "$id" ] || { echo "the forge did not return a release id" >&2; exit 1; }
          fi

          for file in dist/*; do
            curl -sf -X POST \
              "$api/releases/${id}/assets?name=$(basename "$file")" \
              -H "Authorization: token ${CI_TOKEN}" \
              -F "attachment=@${file}" > /dev/null
          done

          # Published last, once every file is attached. A release that appears
          # before its assets is one somebody downloads empty.
          curl -sf -X PATCH "$api/releases/${id}" \
            -H "Authorization: token ${CI_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"draft": false}' > /dev/null

      # Asked of the forge rather than trusted from the uploads reporting success.
      #
      # A sibling project published a release whose binaries, checksums and
      # signature were all in place and whose container image was missing: the
      # job that built the image failed on its own, separately, and the release
      # page looked complete. Nothing here is built by a second workflow, so
      # that exact split cannot happen — but "every upload returned 2xx" is not
      # the same statement as "the release has its files", and the second one is
      # the one that matters to somebody downloading it.
      - name: the release has everything it was built with
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          api="${GITHUB_API_URL:-$FORGEJO_API}/repos/${GITHUB_REPOSITORY}"
          published=$(curl -sf "$api/releases/tags/${TAG}" \
            -H "Authorization: token ${CI_TOKEN}" \
            | python3 -c 'import json,sys; [print(a["name"]) for a in json.load(sys.stdin).get("assets",[])]' \
            | sort)

          expected=$(cd dist && ls | sort)

          missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$published"))
          if [ -n "$missing" ]; then
            echo "these were built and are not on the release:" >&2
            printf '  %s\n' $missing >&2
            exit 1
          fi
          echo "published: $(printf '%s\n' "$published" | tr '\n' ' ')"

      # Asked of the forge rather than trusted from the payload we sent.
      #
      # The first beta was published without the prerelease flag and everything
      # reported success: the assets were there, the signature verified, the
      # release page looked right. What was wrong was invisible from here —
      # /releases/latest, which is the endpoint the stable channel asks,
      # answered with the beta. Nobody who chose not to run betas would have
      # found out except by being offered one.
      - name: a beta is not offered on the stable channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-Beta.*|*-RC.*) ;;
            *) echo "a stable release; nothing to check here."; exit 0 ;;
          esac

          # A 404 is the right answer when every release so far is a beta:
          # there is no latest stable, which is exactly what should happen.
          latest=$(curl -sf "${GITHUB_API_URL:-$FORGEJO_API}/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null || true)

          if [ "$latest" = "$TAG" ]; then
            echo "$TAG is what /releases/latest answers, and that is what the" >&2
            echo "stable channel asks. It was published without the prerelease flag." >&2
            exit 1
          fi
          echo "the stable channel sees: ${latest:-no stable release yet}"

  # Retention runs from here, not from the tag push. The prune asks the API
  # which releases exist, and on a tag push it asked before this one had been
  # published — so it decided from a list that was one version out of date.
  # With `needs:`, it runs only when the release above actually shipped, which
  # also means a failed release never costs the previous beta.
  #
  # Not `on: workflow_run`, whose support here is incomplete.
  prune:
    name: Prune old releases
    needs: release
    runs-on: ubuntu-latest
    container: node:24-trixie
    steps:
      - name: Dispatch the prune, live
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          [ -n "$CI_TOKEN" ] || { echo "CI_TOKEN is not set" >&2; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token $CI_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"ref":"main","inputs":{"dry_run":"false"}}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/prune-releases.yml/dispatches")

          # 204 and nothing else. A dispatch that quietly did not happen is a
          # retention policy that quietly does not exist.
          [ "$code" = "204" ] || { echo "the prune dispatch answered HTTP $code" >&2; exit 1; }
          echo "prune dispatched"

  # The website reads the latest release from this repository's API when it is
  # built, and a build set off by the tag push happens minutes before the
  # release above exists — so it would go on advertising the previous version
  # until something else rebuilt it. Dispatched only once the release shipped.
  site-rebuild:
    name: Rebuild the website
    needs: release
    runs-on: ubuntu-latest
    container: node:24-trixie
    steps:
      - name: Dispatch the website rebuild
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          [ -n "$CI_TOKEN" ] || { echo "CI_TOKEN is not set" >&2; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token $CI_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"ref":"main"}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/site-rebuild.yml/dispatches")

          [ "$code" = "204" ] || { echo "the website rebuild dispatch answered HTTP $code" >&2; exit 1; }
          echo "website rebuild dispatched"
