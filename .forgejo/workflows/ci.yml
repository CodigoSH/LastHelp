# Runs on every push to main, as one job that does each thing once: the checks
# that fail in seconds first, then the tests, then building and starting the
# binary. It used to be two jobs that each set up Go and built the frontend.
#
# No path filter: tests here read docs/ and the Markdown files, so a change that
# is only words can still break the build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test and build
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — from 2021, carrying OpenSSL
    # 1.1.1. That is not a detail: verifying an ed25519 signature needs
    # `pkeyutl -rawin`, which arrived in OpenSSL 3.0, and bullseye has no
    # openssl 3 to install, not even from backports. So the check that our
    # signer and install.sh agree could not run there and skipped itself,
    # leaving CI green over the one thing it exists to prove.
    container: node:24-trixie
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # Without this there is no `tsc`: it is a devDependency and nothing else
      # here installs one.
      - name: install dependencies
        run: |
          go mod download
          bun install --frozen-lockfile

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: go mod tidy -diff

      # Before anything that compiles Go. The binary embeds internal/web/dist,
      # which is build output and therefore not in the repository, so on a fresh
      # checkout `go vet` fails with "pattern all:dist: no matching files found"
      # — a message about embedding that reads like a broken build. Locally it
      # never happens, because the directory is left over from the last build.
      - name: frontend build
        run: bun run build

      - name: typecheck
        run: bun run typecheck

      - name: frontend tests
        run: bun test

      - name: go vet
        run: go vet ./...

      # Pinned, and to the same version scripts/release.sh runs in its
      # preflight: a checker that is not the one CI runs proves nothing about CI.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      # -count=1 is not optional: the architecture rules read the repository
      # from disk, which the test cache does not track. A cached pass there means
      # nothing.
      - name: go test
        run: go test -count=1 -race -covermode=atomic ./...

      # Blocking, and it blocks on one number: "your code is affected by N
      # vulnerabilities". The other figure it prints — advisories in modules
      # this requires but never calls — is noise, and govulncheck does not exit
      # non-zero for it.
      #
      # Pinned. On @latest a new advisory database turns this red on a morning
      # nobody touched the code, which teaches people to ignore it.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: backend build
        run: make backend

      # Building is not running. This starts the binary the job just built and
      # asks it a question, which is the difference between "it compiles" and
      # "it works".
      - name: smoke test
        run: |
          LASTHELP_PORT=8099 ./bin/lasthelp &
          pid=$!
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8099/healthz >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8099/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8099/ | grep -q '<title>LastHelp</title>'
          LASTHELP_PORT=8099 ./bin/healthcheck
          kill $pid
