name: CI

# One job that does each thing once, in the same order in every project: the
# checks that fail in seconds first, then the tests, then building the binary
# and starting it. The runner executes one job at a time, so a workflow of
# several jobs only makes the next push wait for all of them.
#
# No path filter: tests here read docs/ and the Markdown files, so a change that
# is only words can still break the build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test and build
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — from 2021, carrying OpenSSL
    # 1.1.1. That is not a detail: verifying an ed25519 signature needs
    # `pkeyutl -rawin`, which arrived in OpenSSL 3.0, and bullseye has no
    # openssl 3 to install, not even from backports. So the check that our
    # signer and install.sh agree could not run there and skipped itself,
    # leaving CI green over the one thing it exists to prove.
    container: node:24-trixie
    env:
      # What the release publishes is built without cgo, and Go keeps a separate
      # build cache for each setting: vet, staticcheck and the build compile the
      # whole dependency graph once, here, instead of once for each. Building the
      # binary alone took a minute and a half on the runner for that reason.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      # setup-go's own cache stays off: its key is written with a capital "Linux" when it is
      # saved and a lower case "linux" when it is looked for, so what one run saves the next
      # never finds. The cache below has a key written here, in full.
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.27.3'
          cache: false

      # The Go build cache and the module cache, so the dependency graph (SQLite alone is most
      # of it) is compiled once and not on every push. The key is the Go version plus go.sum and
      # has no commit in it on purpose: a hit restores and uploads nothing, and the entry is only
      # written again when a dependency or the toolchain changes (the restore key then starts
      # from the previous entry, so only what changed is compiled). Our own packages recompile
      # either way, because Go keys them by content.
      - name: Locate the Go caches
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ steps.setup-go.outputs.go-version }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # Without this there is no `tsc`: it is a devDependency and nothing else
      # here installs one.
      - name: Install dependencies
        run: |
          go mod download
          bun install --frozen-lockfile

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: go mod tidy -diff

      # Before anything that compiles Go. The binary embeds internal/web/dist,
      # which is build output and therefore not in the repository, so on a fresh
      # checkout `go vet` fails with "pattern all:dist: no matching files found"
      # — a message about embedding that reads like a broken build. Locally it
      # never happens, because the directory is left over from the last build.
      - name: Build frontend
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Frontend tests
        run: bun test --randomize

      - name: go vet
        run: go vet ./...

      # Pinned, and to the same version scripts/release.sh runs in its preflight:
      # a checker that is not the one CI runs proves nothing about CI.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      # The race detector is not run here: it made these tests three or four times slower
      # on this runner and was half of every run. scripts/release.sh runs it before a
      # release is tagged, which is when it has to hold. Everything else is the same.
      # -count=1 is not optional: the architecture rules read the repository from disk,
      # which the test cache does not track, so a cached pass there means nothing.
      #
      # -timeout 10m: Go's own default, spelled out so a package that hangs dies in a
      # named test instead of at the end of the job.
      - name: Go tests
        run: go test -count=1 -timeout 10m -cover ./...

      # Blocking, and it blocks on one number: "your code is affected by N
      # vulnerabilities". The other figure it prints — advisories in modules this
      # requires but never calls — is noise, and govulncheck does not exit
      # non-zero for it.
      #
      # Pinned. On @latest a new advisory database turns this red on a morning
      # nobody touched the code, which teaches people to ignore it.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build backend
        run: make backend

      # Building is not running. This starts the binary the job just built and
      # asks it a question, which is the difference between "it compiles" and
      # "it works".
      - name: Smoke test
        run: |
          # A database of its own, thrown away: without this the server opens
          # lasthelp.db in the working directory, which is somebody's real
          # database the day this step is run anywhere but a fresh checkout.
          db=$(mktemp -d)
          LASTHELP_DB_FILE="$db/smoke.db" LASTHELP_PORT=8099 ./bin/lasthelp &
          pid=$!
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8099/healthz >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8099/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8099/ | grep -q '<title>LastHelp</title>'
          LASTHELP_PORT=8099 ./bin/healthcheck
          kill $pid
