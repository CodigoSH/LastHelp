<!doctype html>
<!--
  lang and dir are stamped by the server from Accept-Language before the first
  byte reaches the browser, and re-stamped by the script if somebody changes
  language without reloading. Leaving lang="en" here is what a screen reader
  would announce for an Arabic page, and a missing dir is a page that renders
  one way and then flips.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Installable the way the dashboard is: a fixed manifest and fixed icons,
      named LastHelp whatever the installation calls itself. The tab title is
      the installation's, written by the server over the line below.
    -->
    <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>LastHelp</title>
    <link rel="stylesheet" href="/styles/theme.css?v=0BUILDSTAMP0" />
    <script type="module" src="/main.js?v=0BUILDSTAMP0"></script>
  </head>
  <body>
    <nav id="nav"></nav>
    <main id="app"></main>
  </body>
</html>
