services:
  lasthelp:
    image: git.codigosh.com/codigosh/lasthelp:latest
      # `latest` moves with each stable release; `beta` follows prereleases.
    # Or build it yourself from this repository:
    # build: .
    container_name: lasthelp
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # The database and the front page's pictures, all in one file. The image
      # runs as uid 10001, not root; a named volume is created with the right
      # owner, a directory bound from the host has to be given it
      # (chown 10001:10001 ./data).
      - lasthelp-data:/data
    environment:
      # Every knob this binary reads is listed in .env.example.
      LASTHELP_PORT: "8080"
      LASTHELP_DB_FILE: "/data/lasthelp.db"
      # The address people open, when a reverse proxy is in front: it is what
      # the links in notifications and shared previews point to.
      # LASTHELP_PUBLIC_URL: "https://help.example.org"
      # "true" when people reach it through a reverse proxy or a tunnel
      # (Nginx, Nginx Proxy Manager, Caddy, Traefik, Pangolin, Cloudflare
      # Tunnel...). Left "false" behind one, every visitor looks like that
      # server: one address in the list of sessions, one sign-in limit shared
      # by everybody. Set "true" with nothing in front, and a caller chooses
      # the address their requests are attributed to.
      LASTHELP_TRUST_PROXY: "false"
      # How many of them a request passes through: 1, unless two are chained
      # (Cloudflare in front of Nginx Proxy Manager, say).
      LASTHELP_TRUST_PROXY_HOPS: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lasthelp-data:
